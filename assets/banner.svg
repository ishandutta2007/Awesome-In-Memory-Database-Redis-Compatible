<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#070a12" />
    </linearGradient>
    
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff4b4b" />
      <stop offset="50%" stop-color="#ff8f3d" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <radialGradient id="glowRed" cx="20%" cy="30%" r="40%">
      <stop offset="0%" stop-color="#dc2626" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#dc2626" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="glowPurple" cx="80%" cy="70%" r="45%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0" />
    </radialGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <style>
    @keyframes pulseCircle {
      0% { r: 6px; opacity: 0.4; }
      50% { r: 14px; opacity: 0.9; }
      100% { r: 6px; opacity: 0.4; }
    }
    @keyframes flowLine {
      0% { stroke-dashoffset: 100; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) scale(1); opacity: 0.3; }
      50% { transform: translateY(-15px) scale(1.2); opacity: 0.8; }
      100% { transform: translateY(0px) scale(1); opacity: 0.3; }
    }

    .node-pulse-1 { animation: pulseCircle 3s infinite ease-in-out; }
    .node-pulse-2 { animation: pulseCircle 4s infinite ease-in-out 1.5s; }
    .node-pulse-3 { animation: pulseCircle 3.5s infinite ease-in-out 0.8s; }
    .particle { animation: floatParticle 6s infinite ease-in-out; }
    .particle-delay { animation: floatParticle 7s infinite ease-in-out 2.5s; }
    
    .data-stream {
      stroke-dasharray: 8, 12;
      animation: flowLine 4s linear infinite;
    }

    .card-bg {
      fill: rgba(17, 24, 39, 0.75);
      stroke: rgba(255, 255, 255, 0.12);
      stroke-width: 1px;
    }
  </style>

  <!-- Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowRed)" />
  <rect width="1200" height="360" rx="16" fill="url(#glowPurple)" />

  <!-- Grid Pattern Overlay -->
  <g opacity="0.08" stroke="#ffffff" stroke-width="1">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" />
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" />
  </g>

  <!-- Dynamic Animated Background Data Streams & Nodes -->
  <g opacity="0.45">
    <path d="M100 80 Q 250 40, 400 90 T 700 70 T 1050 100" fill="none" stroke="#ef4444" stroke-width="2" class="data-stream" />
    <path d="M150 290 Q 400 320, 650 270 T 1100 280" fill="none" stroke="#8b5cf6" stroke-width="2" class="data-stream" />
    <path d="M50 200 Q 300 150, 600 220 T 1150 180" fill="none" stroke="#3b82f6" stroke-width="1.5" class="data-stream" />

    <circle cx="250" cy="40" r="8" fill="#ef4444" class="node-pulse-1" />
    <circle cx="700" cy="70" r="10" fill="#a855f7" class="node-pulse-2" />
    <circle cx="650" cy="270" r="9" fill="#3b82f6" class="node-pulse-3" />
    <circle cx="400" cy="90" r="6" fill="#10b981" class="node-pulse-1" />
    
    <circle cx="180" cy="120" r="4" fill="#ff8f3d" class="particle" />
    <circle cx="920" cy="220" r="5" fill="#ec4899" class="particle-delay" />
    <circle cx="1020" cy="80" r="4" fill="#3b82f6" class="particle" />
    <circle cx="80" cy="280" r="5" fill="#10b981" class="particle-delay" />
  </g>

  <!-- Decorative Border -->
  <rect x="2" y="2" width="1196" height="356" rx="14" fill="none" stroke="url(#titleGrad)" stroke-width="1.5" opacity="0.6" />

  <!-- Header Content / Foreground Text & Glass Card -->
  <g filter="url(#shadow)">
    <rect x="60" y="45" width="1080" height="270" rx="14" class="card-bg" />
    
    <!-- Redis Red Accent Pill Badge -->
    <g transform="translate(90, 75)">
      <rect x="0" y="0" width="240" height="32" rx="16" fill="#dc2626" fill-opacity="0.25" stroke="#ef4444" stroke-width="1.5" />
      <text x="120" y="21" fill="#fca5a5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="1.2">REDIS-COMPATIBLE ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="90" y="160" fill="url(#titleGrad)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" letter-spacing="-0.5">
      Awesome In-Memory Database
    </text>

    <!-- Subtitle -->
    <text x="90" y="205" fill="#e5e7eb" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="500">
      ⚡ Curated Guide to Managed SaaS Platforms, Open-Source Forks &amp; Ultra-Fast Alternatives
    </text>

    <!-- Feature Pills in Foreground -->
    <g transform="translate(90, 240)">
      <rect x="0" y="0" width="165" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="82" y="22" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">☁️ Managed SaaS</text>

      <rect x="180" y="0" width="175" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="267" y="22" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🔓 BSD &amp; MIT Forks</text>

      <rect x="370" y="0" width="195" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="467" y="22" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">🚀 Multi-Threaded Engines</text>

      <rect x="580" y="0" width="180" height="34" rx="8" fill="#1f2937" stroke="#374151" stroke-width="1" />
      <text x="670" y="22" fill="#fbbf24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" text-anchor="middle">📊 Real-Time Pricing</text>
    </g>
  </g>
</svg>
